name: Build IDE

# Full IDE installers: Windows (Inno setup .exe + zip) and macOS (.app zip).
# Backend-only artifacts are built by release.yml; this workflow adds the
# branded VSCodium shell built on native runners.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag (e.g. v1.1.0) to attach the installers to.
          Leave empty to only build workflow artifacts. The IDE is built from
          the branch/tag selected in "Use workflow from".
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: IDE Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: windows
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: yes
      CI_BUILD: no
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      SHOULD_BUILD_ZIP: yes
      SHOULD_BUILD_EXE_SYS: yes
      SHOULD_BUILD_EXE_USR: no
      SHOULD_BUILD_MSI: no
      SHOULD_BUILD_MSI_NOUP: no
      APP_NAME: "Dark Forge"
      BINARY_NAME: darkforge
      ORG_NAME: dark-forge
      GH_REPO_PATH: petushokmaxorka-ai/Dark-Forge
      ASSETS_REPOSITORY: petushokmaxorka-ai/Dark-Forge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build IDE (VSCode pinned clone + gulp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ide
          . ./get_repo.sh
          ./build.sh

      - name: Compile swarm-chat extension
        run: |
          cd extension
          npm ci --no-fund --no-audit
          npm run compile

      - name: Bundle Dark Forge extensions
        run: |
          cd ide
          ./install-bundled-extensions.sh "$PWD/VSCode-win32-x64"

      - name: Package (setup .exe + portable .zip)
        run: |
          cd ide
          mkdir -p assets
          ./prepare_assets.sh
          ls -la assets/

      - uses: actions/upload-artifact@v4
        with:
          name: ide-windows-x64
          path: ide/assets/*
          if-no-files-found: error

  macos:
    name: IDE macOS arm64
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: osx
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable
      SHOULD_BUILD: yes
      CI_BUILD: no
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      APP_NAME: "Dark Forge"
      BINARY_NAME: darkforge
      ORG_NAME: dark-forge
      GH_REPO_PATH: petushokmaxorka-ai/Dark-Forge
      ASSETS_REPOSITORY: petushokmaxorka-ai/Dark-Forge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build IDE (VSCode pinned clone + gulp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ide
          . ./get_repo.sh
          ./build.sh

      - name: Compile swarm-chat extension
        run: |
          cd extension
          npm ci --no-fund --no-audit
          npm run compile

      - name: Bundle Dark Forge extensions
        run: |
          cd ide
          APP_DIR="$PWD/VSCode-darwin-arm64/Dark Forge.app/Contents"
          ./install-bundled-extensions.sh "$APP_DIR"

      - name: Package (.app zip)
        run: |
          cd ide
          mkdir -p assets
          ./prepare_assets.sh
          ls -la assets/

      - uses: actions/upload-artifact@v4
        with:
          name: ide-macos-arm64
          path: ide/assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    # A manual run without a tag has no release to attach to — it only keeps
    # the workflow artifacts (previously this step failed with "GitHub
    # Releases requires a tag", or would have created a bogus "main" release).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Normalize asset names
        run: |
          # VSCodium names assets after the VSCode build number
          # ("Dark ForgeSetup-x64-1.126.05619.exe"); publish them under the
          # Dark Forge release version as documented in the README.
          shopt -s nullglob
          v="${RELEASE_TAG#v}"
          mkdir -p release
          take() {
            local dest="$1"; shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected exactly one asset for ${dest}, found $#: $*"
              exit 1
            fi
            mv "$1" "release/${dest}"
          }
          take "Dark.Forge-Setup-${v}-windows-x64.exe" dist/*Setup-x64-*.exe
          take "Dark.Forge-${v}-win-x64-portable.zip" dist/*-win32-x64-*.zip
          take "Dark.Forge-${v}-macos-arm64-app.zip" dist/*-darwin-arm64-*.zip
          cd release
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Attach to release
        run: |
          # release.yml normally creates the release for a v* tag; create it
          # here only if it does not exist yet (never invent a new tag).
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "DARK FORGE ${RELEASE_TAG#v}" --generate-notes \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
